<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo de Produtos</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd; }
    form { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
    input { padding: 8px; flex: 1; min-width: 120px; }
    button { padding: 8px 16px; cursor: pointer; }
    #status { font-size: 0.85rem; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Catálogo de Produtos</h1>
  <ul id="list"><li>Carregando...</li></ul>

  <form id="form">
    <input id="name" placeholder="Nome do produto" required />
    <input id="price" type="number" step="0.01" placeholder="Preço" required />
    <button type="submit">Adicionar</button>
  </form>
  <div id="status"></div>

  <script>
    const list = document.getElementById('list');
    const form = document.getElementById('form');
    const status = document.getElementById('status');

    function formatPrice(p) {
      return p.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    async function loadItems() {
      const res = await fetch('/api/items');
      const data = await res.json();
      list.innerHTML = data.items
        .map((i) => `<li><span>${i.name}</span><span>${formatPrice(i.price)}</span></li>`)
        .join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = 'Enviando...';
      const name = document.getElementById('name').value;
      const price = parseFloat(document.getElementById('price').value);
      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price }),
      });
      if (res.ok) {
        status.textContent = 'Produto adicionado!';
        form.reset();
        loadItems();
      } else {
        const err = await res.json();
        status.textContent = 'Erro: ' + err.error;
      }
    });

    loadItems();
  </script>
</body>
</html>
